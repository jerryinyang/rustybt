name: Notebook Validation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/examples/notebooks/**/*.ipynb'
      - '.github/workflows/notebook-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/examples/notebooks/**/*.ipynb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    name: Validate Notebook APIs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install jupyter nbconvert

      - name: Validate notebook imports
        run: |
          python scripts/validate_notebook_imports.py

      - name: Check for fabricated APIs
        run: |
          python scripts/check_notebook_apis.py

      - name: Generate validation report
        if: always()
        run: |
          python scripts/generate_notebook_report.py > notebook_validation_report.txt
          cat notebook_validation_report.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-validation-report
          path: notebook_validation_report.txt
          retention-days: 30

  test-notebook-execution:
    name: Test Notebook Execution (Smoke Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install jupyter nbconvert pytest

      - name: Run smoke tests on notebooks
        run: |
          # Only test import cells (first few cells)
          python scripts/test_notebook_smoke.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-test-results
          path: notebook_test_results.json
          retention-days: 30

  validate-api-versions:
    name: Validate API Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check API version markers
        run: |
          python scripts/check_api_versions.py

      - name: Verify API compatibility
        run: |
          python scripts/verify_api_compatibility.py

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-notebooks, test-notebook-execution, validate-api-versions]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Notebook Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "- Notebook API Validation: ${{ needs.validate-notebooks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Execution Smoke Tests: ${{ needs.test-notebook-execution.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Version Check: ${{ needs.validate-api-versions.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All notebooks have been validated for API correctness." >> $GITHUB_STEP_SUMMARY
