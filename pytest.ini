[pytest]
env =
    SCIPY_ARRAY_API=0

# Register custom markers to avoid warnings
markers =
    integration: Integration tests that test interactions between components
    property: Property-based tests using Hypothesis
    regression: Performance regression tests
    slow: Slow-running tests (>1 second)
    validation: Cross-validation tests
    benchmark: Performance benchmark tests
    websocket_integration: WebSocket integration tests
    layer_1_data: Layer 1 data handling validation tests
    layer_2_signals: Layer 2 signal computation validation tests
    layer_3_orders: Layer 3 order lifecycle validation tests
    layer_4_broker: Layer 4 broker transaction validation tests
    layer_5_portfolio: Layer 5 portfolio returns validation tests
